<!DOCTYPE html>
<html>
<head>
<title>bhai chara Full Teamwork Exam 🧪</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: linear-gradient(135deg, #fff5f7, #fce4ec); color: #4b2c20; }
    .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #d81b60; font-family: 'Dancing Script', cursive; font-size: 2.5rem; }
    #timer { font-size: 22px; color: #e91e63; font-weight: bold; text-align: center; margin: 20px 0; position: sticky; top: 10px; background: #fff0f5; padding: 15px; border-radius: 15px; border: 2px solid #f8bbd0; z-index: 100; }
    .question { margin-bottom: 25px; padding: 20px; border-radius: 15px; background: #fffafa; border: 1px solid #fce4ec; transition: 0.3s; }
    .question:hover { border-color: #ff69b4; box-shadow: 0 5px 15px rgba(255,105,180,0.1); }
    .question p { font-weight: 600; font-size: 1.1rem; margin-bottom: 15px; color: #333; }
    .opt-label { cursor: pointer; display: block; padding: 8px 12px; border-radius: 8px; margin: 5px 0; transition: 0.2s; border: 1px solid transparent; }
    .opt-label:hover { background: #fce4ec; border-color: #f8bbd0; }
    input[type="text"] { width: 70%; padding: 15px; border-radius: 12px; border: 2px solid #f8bbd0; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; font-size: 1rem; text-align: center; }
    button { padding: 15px 40px; border-radius: 50px; border: none; background: #d81b60; color: white; font-weight: bold; cursor: pointer; display: block; margin: 20px auto; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 5px 15px rgba(216,27,96,0.3); }
    button:hover { background: #ad1457; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(216,27,96,0.4); }
    .intro-msg { text-align: center; font-style: italic; color: #8d4b2d; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="container">
    <h2>🧪 Teamwork Science Lab</h2>
    <p class="intro-msg">Focus bhaiyo ! Har ek sawal teamwork ke liye important hai. 🐻✨</p>

    <div id="startScreen">
        <input type="text" id="name" placeholder="Enter Your Name, commerce bhaiyo">
        <button onclick="startExam()">Launch Experiment 🚀</button>
    </div>

    <div id="exam" style="display:none;">
        <div id="timer">Time Remaining: 45:00</div>
        <form id="quizForm"></form>
        <button type="button" onclick="submitExam()">Final Submission 📩</button>
    </div>
</div>

<script>
let time = 2700; // 45 minutes for 67 questions
let timerInterval;
let studentName = "";

// Full Answer Key mapped from your image
const answers = {
    1:"B", 2:"A", 3:"B", 4:"C", 5:"D", 6:"B", 7:"D", 8:"D", 9:"D", 10:"B",
    11:"B", 12:"A", 13:"A", 14:"B", 15:"A", 16:"D", 17:"B", 18:"B", 19:"B", 20:"C",
    21:"D", 22:"C", 23:"D", 24:"C", 25:"D", 26:"A", 27:"C", 28:"B", 29:"C", 30:"C",
    31:"B", 32:"A", 33:"D", 34:"B", 35:"D", 36:"B", 37:"C", 38:"C", 39:"A", 40:"C",
    41:"D", 42:"A", 43:"B", 44:"A", 45:"D", 46:"D", 47:"A", 48:"A", 49:"A", 50:"D"
};

// Full Question Set from provided images
const questionData = [
    {q: "If a superior has two subordinates what is total number of relations among them:", opts: ["A. 7", "B. 6", "C. 5", "D. 4"]},
    {q: "Managerial functions are:", opts: ["A. inter-related", "B. not related to each other", "C. related with one and not others", "D. related for specific situation"]},
    {q: "Which of these is not a function of management?", opts: ["A. planning", "B. coordinating", "C. organising", "D. controlling"]},
    {q: "Planning involves:", opts: ["A. doing the present task", "B. analysing past performance", "C. deciding future course of actions", "D. making comparative study"]},
    {q: "Capital structure decision is :", opts: ["A. long-range planning", "B. medium range planning", "C. short range planning", "D. operational planning"]},
    {q: "The managerial function of identification and grouping of activities is known as :", opts: ["A. planning", "B. organising", "C. staffing", "D. directing"]},
    {q: "Directing function of management involves:", opts: ["A. thinking ahead", "B. delegating authority", "C. manpower planning", "D. initiating action"]},
    {q: "Formal relationship between the individual and departments is known as :", opts: ["A. organisational plan", "B. organisational budget", "C. organisational structure", "D. organisational relationship"]},
    {q: "Exchange of thought, views and ideas is known as :", opts: ["A. planning", "B. exchanging", "C. directing", "D. communication"]},
    {q: "Quantitative expression of business plans and programmes is known as :", opts: ["A. business planning", "B. budgeting", "C. scanning", "D. controlling"]},
    {q: "Which function is considered as the essence of management?", opts: ["A. organising", "B. co-ordinating", "C. controlling", "D. planning"]},
    {q: "Delegation of authority is an element of:", opts: ["A. organizing", "B. coordinating", "C. controlling", "D. staffing"]},
    {q: "Policy making is an important part of:", opts: ["A. planning", "B. organizing", "C. coordinating", "D. motivating"]},
    {q: "Which of the following is an example of informal group?", opts: ["A. business", "B. family", "C. hospital", "D. university"]},
    {q: "Management means managing men:", opts: ["A. tactfully", "B. strictly", "C. carefully", "D. properly"]},
    {q: "Managerial function of monitoring the work is known:", opts: ["A. planning", "B. organising", "C. staffing", "D. controlling"]},
    {q: "Controlling is:", opts: ["A. looking ahead", "B. looking back", "C. delegation of authority", "D. guiding people"]},
    {q: "Production planning and control purchasing, maintenance etc. are related to :", opts: ["A. manufacturing function", "B. ancillary function", "C. advisory function", "D. none of these"]},
    {q: "Production planning is the function of :", opts: ["A. arranging various inputs", "B. looking ahead", "C. procuring of orders", "D. none of these"]},
    {q: "Management is :", opts: ["A. An art", "B. A science", "C. Both art and science", "D. None of these"]},
    {q: "Management is", opts: ["A. a pure science", "B. a pure art", "C. neither a pure science nor a pure art", "D. a social science with general features of science and art"]},
    {q: "The system of management is essential in every:", opts: ["A. Government", "B. Business", "C. Organised group effort", "D. Formal group"]},
    {q: "Management includes:", opts: ["A. four branches", "B. five branches", "C. six branches", "D. seven branches"]},
    {q: "Management is :", opts: ["A. a science", "B. an art", "C. an art as well as science", "D. none of these"]},
    {q: "Management is needed at:", opts: ["A. middle level", "B. top level", "C. operative level", "D. all level"]},
    {q: "Which one is true?", opts: ["A. Management and administration are same", "B. Administration is higher than management", "C. Management is higher than administration", "D. All the above"]},
    {q: "Owners, Board of Directors, Managing Director etc. are included under:", opts: ["A. middle management", "B. top management", "C. lower management", "D. all management"]},
    {q: "Departmental managers, section officers etc. are included under:", opts: ["A. lower management", "B. top management", "C. middle management", "D. none of these"]},
    {q: "Superintendents, foremen, supervisors etc. are included under:", opts: ["A. top management", "B. middle management", "C. lower management", "D. none of these"]},
    {q: "Management as factor of production does not include:", opts: ["A. land", "B. drawings", "C. labour", "D. capital"]},
    {q: "Management may be a :", opts: ["A. factor of production", "B. factor of consumption", "C. factor of saving", "D. factor of investment"]},
    {q: "Because of application of fundamental principles, management is termed as :", opts: ["A. a science", "B. an art", "C. a profession", "D. a science as well as an art"]},
    {q: "Management need creativity of the managers for which it is termed as :", opts: ["A. a science", "B. an art", "C. a science and an art", "D. a profession"]},
    {q: "The planning function of management is performed by :", opts: ["A. lower management", "B. middle management", "C. top management", "D. all of these"]},
    {q: "Management is :", opts: ["A. tangible", "B. intangible", "C. fictitious", "D. none of these"]},
    {q: "Management is a :", opts: ["A. continuous process", "B. normal process", "C. universal process", "D. none of these"]},
    {q: "Operational level of management consists of :", opts: ["A. functional manager", "B. foreman", "C. supervisors", "D. none of these"]},
    {q: "Who is regarded as Father of Modern Management :", opts: ["A. Henry Fayal", "B. F. W. Taylor", "C. Phillip Kotler", "D. Clerk and Clark"]},
    {q: "In an organisation, the most important element is :", opts: ["A. Task", "B. Cost", "C. People", "D. Time"]},
    {q: "The following is not an objective of management:", opts: ["A. Earning profits", "B. Growth of the organisation", "C. Providing employment", "D. None of these"]},
    {q: "Policy formulation is the function of :", opts: ["A. Top-level managers", "B. Middle-level managers", "C. Operational management", "D. All of these"]},
    {q: "Coordination is :", opts: ["A. Function of management", "B. The essence of management", "C. An objective of management", "D. None of these"]},
    {q: "Which of the following points supports the fact that 'Management is a profession'?", opts: ["A. Service motive", "B. Personalised application", "C. Principle based on experimentation", "D. Based on practice and creativity"]},
    {q: "Which of the following functions is performed by the middle-level management ?", opts: ["A. Analysis of business environment", "B. Maintenance of quality output", "C. Formulation of organisational goals", "D. Interpretation of the policies framed by the top management"]},
    {q: "Top-level management does not :", opts: ["A. control activities of all departments", "B. make sub-plans for the lower level", "C. determine objectives and policies", "D. establish contacts with outside world"]},
    {q: "Planning is deciding in advance what to do, when to do it, and who is to do it. This has been described by", opts: ["A. Koontz and O'Donnell", "B. Hallmann", "C. Allen", "D. Terry"]},
    {q: "Planning is a", opts: ["A. mental process", "B. physical process", "C. guess work process", "D. none of these"]},
    {q: "Planning is the function of the", opts: ["A. manager", "B. accountant", "C. organisation", "D. none of these"]},
    {q: "Any work without proper planning will create", opts: ["A. confusion", "B. doubts", "C. illusion", "D. all of these"]},
    {q: "Planning is a", opts: ["A. continuous process", "B. intellectual process", "C. managerial efficiency", "D. all of these"]}
];

function startExam(){
    studentName=document.getElementById("name").value;
    if(studentName.trim()==""){alert("Please enter your name, Sania! 🐻");return;}

    document.getElementById("startScreen").style.display="none";
    document.getElementById("exam").style.display="block";

    let form=document.getElementById("quizForm");
    form.innerHTML="";

    questionData.forEach((item,index)=>{
        form.innerHTML+=`<div class="question">
        <p>${index+1}. ${item.q}</p>
        ${item.opts.map(opt=>
            `<label class="opt-label"><input type="radio" name="q${index+1}" value="${opt[0]}"> ${opt}</label>`
        ).join("")}
        </div>`;
    });

    startTimer();
}

function startTimer(){
    timerInterval=setInterval(()=>{
        let minutes=Math.floor(time/60);
        let seconds=time%60;
        document.getElementById("timer").innerText=
        `Time Left: ${minutes}:${seconds<10?"0"+seconds:seconds}`;
        time--;
        if(time<0){
            clearInterval(timerInterval);
            submitExam();
        }
    },1000);
}

function submitExam(){
    clearInterval(timerInterval);
    let score=0;
    let wrong=[];

    for(let i=1; i<=questionData.length; i++){
        let selected=document.querySelector(`input[name="q${i}"]:checked`);
        if(selected && selected.value==answers[i]){
            score++;
        }else{
            wrong.push(i);
        }
    }

    alert(`Experiment Finished!\nScientist: ${studentName}\nScore: ${score}/${questionData.length}`);

    let msg = `*Online Exam Result*%0A*Name:* ${studentName}%0A*Score:* ${score}/${questionData.length}%0A*Wrong Qs:* ${wrong.slice(0,50).join(",")}${wrong.length > 10 ? '...' : ''}`;
    window.open("https://wa.me/918917694522?text=" + msg);
}
</script>

</body>
</html>
